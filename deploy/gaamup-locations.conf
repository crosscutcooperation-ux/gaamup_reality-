root /var/www/gaamup-current/public;
client_max_body_size 200m;
server_tokens off;
include /etc/nginx/snippets/gaamup-cloudflare-realip.conf;
charset utf-8;
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
include /etc/nginx/snippets/gaamup-security-headers.conf;
location ^~ /.well-known/acme-challenge/ {
    root /var/www/panvibes-acme;
    default_type text/plain;
    try_files $uri =404;
}
location ~ /\. { deny all; }
location /_next/static/ {
    alias /var/www/gaamup-current/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /api/chat {
    limit_req zone=gaamup_chat burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store" always;
}
location = /api/enquiries {
    limit_req zone=gaamup_enquiries burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store" always;
}
location = /api/enquiries/config {
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
location ^~ /api/admin/ {
    proxy_read_timeout 120s;
    limit_req zone=gaamup_admin burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
location ^~ /scene-assets/ {
    alias /var/lib/gaamup/scene-assets/;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    expires 1d;
}
# Hashed viewer bundles contain the same renderer and geometry logic, cached once.
location ^~ /scenes/runtime/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
}
# Versioned application scripts stay revalidated; the fixed vendor runtime is cached.
location ~ ^/scenes/.*/vendor/.*\.(js|json)$ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location ~* \.(glb|bin|hdr|wasm|woff2?|webp|png|jpe?g|svg|mp4|pdf)$ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location /scenes/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
location / {
    proxy_hide_header Cache-Control;
    add_header Cache-Control "$upstream_http_cache_control, no-transform" always;
    include /etc/nginx/snippets/gaamup-security-headers.conf;
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
}
access_log /var/log/nginx/gaamup.access.log;
error_log /var/log/nginx/gaamup.error.log;
