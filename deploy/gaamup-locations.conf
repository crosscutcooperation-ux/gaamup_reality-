root /var/www/gaamup-current/public;
client_max_body_size 200m;
server_tokens off;
charset utf-8;
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
location ^~ /.well-known/acme-challenge/ {
    root /var/www/panvibes-acme;
    default_type text/plain;
    try_files $uri =404;
}
location ~ /\. { deny all; }
location /_next/static/ {
    alias /var/www/gaamup-current/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
location ^~ /scene-assets/ {
    alias /var/lib/gaamup/scene-assets/;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    expires 1d;
}
location ~* \.(glb|bin|hdr|wasm|woff2?|webp|png|jpe?g|svg|mp4|pdf)$ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location /scenes/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
}
access_log /var/log/nginx/gaamup.access.log;
error_log /var/log/nginx/gaamup.error.log;
