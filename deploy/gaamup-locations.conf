root /var/www/gaamup-current/public;
client_max_body_size 200m;
server_tokens off;
include /etc/nginx/snippets/gaamup-cloudflare-realip.conf;
charset utf-8;
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
location ^~ /.well-known/acme-challenge/ {
    root /var/www/panvibes-acme;
    default_type text/plain;
    try_files $uri =404;
}
location ~ /\. { deny all; }
location /_next/static/ {
    alias /var/www/gaamup-current/.next/static/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /api/enquiries {
    limit_req zone=gaamup_enquiries burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 12k;
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    add_header Cache-Control "no-store" always;
}
location = /api/enquiries/config {
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}
location ^~ /api/admin/ {
    limit_req zone=gaamup_admin burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}
location ^~ /scene-assets/ {
    alias /var/lib/gaamup/scene-assets/;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:4000;
    expires 1d;
}
location ~* \.(glb|bin|hdr|wasm|woff2?|webp|png|jpe?g|svg|mp4|pdf)$ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location /scenes/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
}
location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
}
access_log /var/log/nginx/gaamup.access.log;
error_log /var/log/nginx/gaamup.error.log;
